; The calculator, as an application built with the Bolt SDK.
;
;   build.cmd examples\calc          build it
;   run.cmd examples\calc            put it on the disk and start the machine
;
; Every key is described in docs/guide/project-file.md.

[application]
name        = SDK Calculator
module      = sdkcalc
version     = 1.0.0.0
description = Calculator
product     = Bolt SDK Examples
copyright   = Copyright (c) Noah Wooten 2023-2026
icon        = AppIcon_Calculator

[build]
sdk     = 10
sources = src/main.c src/calc.c
imports = user wndmgr cmnctl2

; The pictures the application carries, attached to the file after the link.
; The name is what the code asks for; the options are no-compress and no-flip.
[resources]
AppIcon_Calculator = res/calculator.bmp, no-compress

; How it is installed. With this section the build writes sdkcalc.bxi beside
; sdkcalc.bxf: run.cmd puts a package on the desktop, and opening it installs
; the calculator into /programs/sdkcalc with links in the Actions menu and,
; ticked by default, on the desktop.
[package]
appid     = sdkcalc
publisher = Bolt SDK Examples
desktop   = default

; What the installer writes down, under Software/<appid> and nowhere else, and
; takes away again when the application is removed.
[registry]
Software/sdkcalc/InstalledFrom = string:Bolt SDK
