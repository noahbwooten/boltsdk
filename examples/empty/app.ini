; An empty Bolt application: the least it takes to run.
;
;   build.cmd examples\empty
;   run.cmd examples\empty
;
; Copy this folder to start an application, and change the [application]
; section first: module is the file's name on the machine, so two applications
; on one machine need two different ones. Every key is described in
; docs/guide/project-file.md.

[application]
name        = Empty Application
module      = empty
version     = 1.0.0.0
description = Empty Application
product     = Bolt SDK Examples
copyright   = Copyright (c) Noah Wooten 2023-2026
icon        =

[build]
sdk     = 10
sources = src/main.c
imports = user wndmgr
